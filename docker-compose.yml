version: '3.8'

services:
  # Base de datos de grafos para cálculo de rutas
  neo4j:
    image: neo4j:5.15-community
    container_name: escala-neo4j
    ports:
      - "7474:7474" # Consola HTTP
      - "7687:7687" # Protocolo Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASS}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  # Base de datos relacional y espacial (PostGIS)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: escala-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Caché en memoria para búsquedas calientes
  redis:
    image: redis:7-alpine
    container_name: escala-redis
    ports:
      - "6379:6379"

  # Servicio 1: Engine de Búsqueda y Rutas en Go
  route-engine:
    build:
      context: ./backend-go
    container_name: escala-route-engine
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - REDIS_URL=${REDIS_HOST}:${REDIS_PORT}
    depends_on:
      - neo4j
      - redis

  # Servicio 2: API Geográfica y Metadatos en FastAPI
  spatial-api:
    build:
      context: ./backend-python
    container_name: escala-spatial-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - postgres

volumes:
  neo4j_data:
  postgres_data: