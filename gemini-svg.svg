<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&amp;family=Syne:wght@700;800&amp;display=swap');
      .title-brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 58px; fill: #F8FAFC; letter-spacing: -2px; }
      .tagline-brand { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; fill: #10B981; letter-spacing: 4px; }
    </style>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="#090D16" rx="16"/>

  <!-- Isotipo Topológico -->
  <g transform="translate(45, 40)">
    <rect width="120" height="120" rx="28" fill="#111827" stroke="#1F2937" stroke-width="2"/>
    <path d="M 30 90 L 60 35 L 90 75" fill="none" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 35 L 95 35" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="30" cy="90" r="7" fill="#F8FAFC"/>
    <circle cx="60" cy="35" r="9" fill="#10B981"/>
    <circle cx="60" cy="35" r="16" fill="#10B981" fill-opacity="0.2"/>
    <circle cx="90" cy="75" r="7" fill="#F97316"/>
  </g>

  <!-- Marca Nominativa -->
  <g transform="translate(195, 105)">
    <text class="title-brand">ESCALA</text>
    <text x="5" y="32" class="tagline-brand">ROUTE TOPOLOGY PLATFORM</text>
  </g>
</svg>
